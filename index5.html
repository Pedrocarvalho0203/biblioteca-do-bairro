<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .botao-pauta {
            padding: 10px 18px;
            border: 0;
            border-radius: 999px;
            background: #5269c8;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 150ms ease, transform 150ms ease;
        }

        .botao-pauta:hover {
            transform: translateY(-1px);
            background: #4056b4;
        }

        .botao-pauta:focus-visible {
            outline: 3px solid #aebafa;
            outline-offset: 3px;
        }

        .tabela-pauta-wrapper {
            max-width: 560px;
            margin-top: 18px;
            overflow: hidden;
            border: 1px solid #e3e8f2;
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 22px rgb(34 53 89 / 8%);
        }

        .tabela-pauta {
            width: 100%;
            border-collapse: collapse;
            color: #29364d;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .tabela-pauta th,
        .tabela-pauta td {
            padding: 14px 18px;
            border-bottom: 1px solid #edf0f5;
        }

        .tabela-pauta th {
            background: #f1f4ff;
            color: #5269a8;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-align: left;
            text-transform: uppercase;
        }

        .tabela-pauta th:last-child,
        .tabela-pauta .nota {
            width: 100px;
            text-align: center;
        }

        .tabela-pauta tbody tr:nth-child(even) {
            background: #f9faff;
        }

        .tabela-pauta tbody tr:hover {
            background: #f0f4ff;
        }

        .tabela-pauta tbody tr:last-child td {
            border-bottom: 0;
        }

        .tabela-pauta .nota {
            color: #3b5fba;
            font-size: 16px;
            font-weight: 700;
        }
    </style>
    <script>
        var contador=0;
        var notas = [11, 12, 15, 17, 6, 10];
        var disciplinas = ["Matemática", "Português", "História", "Geografia", "Física", "Química"];
        function mostrarNome() {
            var nome = document.getElementById("nome").value;
            document.getElementById("resposta").innerHTML = "O meu nome é: " + nome;
        }
        function incrementa() {
            contador++;
            document.getElementById("contador").innerHTML = contador;
            if (contador >= 0) {
                document.getElementById("contador").setAttribute("style", "color:darkgreen");
            }
        }
        function decrementa() {
            contador--;
            document.getElementById("contador").innerHTML = contador;
            if (contador < 0) {
                document.getElementById("contador").setAttribute("style", "color:red");
            }
        }
        function mostrarPauta() {
            var corpoTabela = document.getElementById("corpo-pauta");
            corpoTabela.innerHTML = "";
            for (var i = 0; i < disciplinas.length; i++) {
                var linha = corpoTabela.insertRow();
                linha.insertCell().textContent = disciplinas[i];
                var celulaNota = linha.insertCell();
                celulaNota.className = "nota";
                celulaNota.textContent = notas[i];
            }
        }
    </script>
</head>
<body>
    <h1>Introdução</h1>
    <input type="text" placeholder="Digite seu nome" id="nome">
    <input type="button" placeholder="Digite seu sobrenome" value="Clicar" onclick="mostrarNome()">
    <p id="resposta">O meu nome é: </p>
    <p id="contador">0</p>
    <input type="button" value="+" onclick="incrementa()">
   
    <h1>Pauta</h1>
    <input class="botao-pauta" type="button" value="Mostrar disciplinas e notas" onclick="mostrarPauta()">
    <div class="tabela-pauta-wrapper">
        <table class="tabela-pauta">
            <tr>
                <th>Disciplina</th>
                <th>Nota</th>
            </tr>
            <tbody id="corpo-pauta"></tbody>
        </table>
    </div>
 
</body>
</html>
